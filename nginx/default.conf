server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;

    index index.php index.html;
    charset utf-8;

    # Opciones de seguridad y compresión
    server_tokens off;
    client_max_body_size 64M;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log error;

    # Rutas principales dirigidas al front-controller de Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deshabilitar logs para favicon y robots.txt
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Manejo de scripts PHP a través de PHP-FPM (contenedor 'app')
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    # Denegar acceso a archivos ocultos (por ejemplo .env, .git)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
